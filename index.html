    ${F('swords','Sellsword captains this season','Each fights in one operation, then leaves',`${(H.market.swords||[]).length?`<div class="suitors">${H.market.swords.map((c,i)=>`<div class="hcard" style="display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:8px">${portrait(Object.assign({origin:'merc'},c),48)}<span style="min-width:0"><span class="sname">${esc(c.given)}<span class="tier">${SWORD_TIER[c.tier][0]}</span></span><span class="sline">${spOf(c).name} · ${c.age} · ${STATS.map(k=>`${k} ${c.st[k]}`).join(', ')}</span><span class="sline">${esc(c.gear.weapon)} (+${wVal(c.gear.weapon)}) · ${esc(c.gear.armor)} (+${aVal(c.gear.armor)} wounds)</span></span><button class="sm" style="margin:0" data-hire="${i}" ${H.gold>=swordPrice(c.tier)?'':'disabled'}>Hire · ${swordPrice(c.tier)} gold</button></div>`).join('')}</div>`:'<p class="muted" style="margin:0">All hired this season.</p>'}
      ${H.members.some(m=>m.merc&&!m.dead)?`<p style="margin:10px 0 0;font-size:16px">In your pay: ${H.members.filter(m=>m.merc&&!m.dead).map(m=>esc(m.given)).join(', ')}. Choose them for any operation this season.</p>`:''}`)}
    <div class="two">${F('heir','Heirlooms this season','',`<ul class="wares">${stock('heirloom')}</ul>`)}${F('spec','Specialists this season','',`<ul class="wares">${stock('specialty')}</ul>`)}</div>
    ${tradeView()}`;
}

/* ---------- relations with each house ---------- */
const TENSION=['Cordial','Cool','Wary','Hostile','Bitter','Blood feud'];
const STRIKE_HOW={land:'seize your land or send assassins',revenge:'send assassins or kidnappers',crown:'slander you at court',wealth:'raid your storehouses or kidnap one of yours'}; /* any of them may also lure away a resentful bannerman of yours, or one in revolt */
function guards(n){
  const g=[];if(atWar(n))return g;
  if(alliedWith(n))g.push('a military alliance');
  H.dip.truces.filter(t=>t.house===n&&t.until>H.cycle).forEach(t=>g.push(`a truce until ${seasonOf(t.until)}, year ${yearOf(t.until)}`));
  H.pacts.filter(p=>p.house===n&&p.kind.startsWith('Pact of peace')).forEach(p=>g.push(p.kind.includes('coerced')?'a coerced pact of peace':'a pact of peace'));
  if(H.pacts.some(p=>p.house===n&&p.kind==='Marriage alliance'))g.push('a marriage alliance');
  H.members.filter(m=>m.hostage===n&&!m.dead).forEach(m=>g.push(`you hold ${m.given} as a ward`));
  return g;
}
/* how a holding is styled by tier: Hamlet of Coldford, Coldford Clearing, Coldford Village, Holdfast of Coldford, Coldford Castle, Coldford Estate */
function holdingName(l){const t=String(l.tier||'').toLowerCase(),n=l.name;
  if(t==='wild clearing')return n+' Clearing';
  if(t==='hamlet')return 'Hamlet of '+n;
  if(t==='outlaw hamlet')return 'Outlaw Hamlet of '+n;
  if(t==='holdfast')return 'Holdfast of '+n;
  if(t==='outlaw holdfast')return 'Outlaw Holdfast of '+n;
  return n+' '+String(l.tier).replace(/\b\w/g,c=>c.toUpperCase());}
function tiesWith(n){
  const t=[];const add=(group,text,tone)=>t.push({group,text,tone:tone||''});
  const w=warWith(n);if(w)add('War',`At war since ${seasonOf(w.since)}, year ${yearOf(w.since)} · ${w.wins} won, ${w.losses} lost`,'bad');
  if(alliedWith(n))add('Treaties','Military alliance: each defends the other','good');
  H.dip.routes.filter(x=>x.house===n).forEach(x=>add('Trade',`A ${x.size} trade route: ${routeActive(x)?`+${x.income} gold each season`:routeStatus(x)}`,routeActive(x)?'good':'warn'));
  if(H.dip.embargo.includes(n))add('Trade','You hold them under embargo','bad');
  H.dip.embargoedBy.filter(x=>x.house===n).forEach(()=>add('Trade','They hold you under embargo','bad'));
  H.dip.truces.filter(t=>t.house===n&&t.until>H.cycle).forEach(t=>add('Treaties',`Truce until ${seasonOf(t.until)}, year ${yearOf(t.until)}`,'good'));
  H.dip.calls.filter(c=>c.from===n).forEach(c=>add('Treaties',`They call you to arms against House ${c.against}`,'warn'));
  H.pacts.filter(p=>p.house===n).forEach(p=>add('Treaties',p.kind+(p.income?` · +${p.income} gold each season`:''),'good'));
  H.members.filter(m=>m.origin==='married'&&m.from===n).forEach(m=>{const s=spouseOf(m);add('Marriages',`${m.given} of House ${n} is wed to ${s?s.given:'one of yours'}${m.dead?' (dead)':''}`,m.dead?'':'good')});
  H.offers.filter(o=>o.house===n).forEach(()=>add('Marriages','They have offered a marriage. Arrange it in Bloodlines.','warn'));
  H.members.filter(m=>m.hostage===n&&!m.dead).forEach(m=>add('Wards',`You hold ${m.given}, age ${m.age}, as hostage${m.returnDue?'. Decision due':''}`,'good'));
  H.members.filter(m=>m.kept&&m.from===n&&!m.dead).forEach(m=>add('Wards',`${m.given}, once their ward, chose to stay with you`,'bad'));
  H.members.filter(m=>m.returned===n).forEach(m=>add('Wards',`${m.given} was sent home to them`));
  H.members.filter(m=>m.givenTo===n).forEach(m=>add(m.givenAs==='ward'?'Wards':'Marriages',m.givenAs==='ward'?`${m.given} was given to them as a ward under treaty`:m.givenWhy==='match'?`${m.given} wed into their house`:`${m.given} wed into their house under treaty`,m.givenWhy==='match'?'good':'bad'));
  H.members.filter(m=>!m.dead&&m.wedTo&&m.wedTo.kind==='lord'&&m.wedTo.house===n).forEach(m=>add('Marriages',`${m.given} of your house is consort to their ${m.wedTo.sex==='f'?'Lady':'Lord'}, ${m.wedTo.given}`,'good'));
  (H.claims||[]).filter(c=>c.house===n).forEach(c=>add('Marriages',`Your blood holds a claim on their house through ${claimantName(c)}${(H.disputes||[]).some(d=>d.house===n)?' (disputed)':''}`,'good'));
  H.dip.demands.filter(d=>d.house===n).forEach(()=>add('War','They have sent terms for peace. Answer in The Realm this Winter.','warn'));
  H.members.filter(m=>m.origin==='adopted'&&!m.hostage&&!m.kept&&!m.returned&&m.from===n&&!m.dead).forEach(m=>add('Wards',`${m.given} was born to them and raised by you`));
  H.hostageClaims.filter(c=>c.house===n).forEach(()=>add('Wards','They owe you a ward. Claim it in Bloodlines.','warn'));
  H.informants.filter(i=>i.house===n).forEach(i=>add('Spies',`${i.name} reports to you from inside their hall`,'good'));
  const sec=H.secrets.filter(s=>s.house===n).length;if(sec)add('Spies',`You hold ${sec} of their secret${sec>1?'s':''}`,'good');
  if(H.plans.some(p=>p.house===n))add('Spies','You hold their battle plans','good');
  H.captives.filter(c=>c.house===n).forEach(c=>add('Captives',`You hold ${c.name}, ${c.rank}`,'good'));
  H.members.filter(m=>m.captive&&m.captive.house===n&&!m.dead).forEach(m=>add('Captives',`They hold ${m.given} of your house`,'bad'));
  {const ls=H.lands.filter(l=>l.from===n).map(holdingName);if(ls.length)add('Land',`You took the holding${ls.length>1?'s':''} of ${ls.length>1?ls.slice(0,-1).join(', ')+' and '+ls[ls.length-1]:ls[0]} from them`,'bad')}
  return t;
}
function stanceOf(r){
  if(atWar(r.name))return 'At war';
  if(alliedWith(r.name))return 'Allied';
  const g=guards(r.name);
  const wed=H.pacts.some(p=>p.house===r.name&&p.kind==='Marriage alliance');
  if(g.length&&r.hostility>=3)return wed?'Bound by marriage, but resentful':'Held in check';
  if(wed)return 'Bound by marriage';
  if(g.length)return 'At peace';
  if(r.hostility>=3)return 'Enemies';
  if(H.pacts.some(p=>p.house===r.name))return 'Partners';
  return r.hostility?'Uneasy':'Neutral';
}
function threatLine(r){
  if(atWar(r.name))return `<span class="hot">At war.</span> Each season their power clashes with yours${warAllies(r.name).length?' and your allies’':''}.`;
  const g=guards(r.name);
  if(g.length)return `<span class="okc">Will not strike at you</span> while ${g.join(', and ')}.`;
  if(!r.hostility)return 'No reason to strike at you yet.';
  return `<span class="hot">${r.hostility*6}% chance each season</span> they ${STRIKE_HOW[r.agenda]}${swayable().length?', or lure away a discontented house sworn to you':''}.`;
}
function tensionMeter(r){return `<span class="tension t${r.hostility}"><span class="host" aria-hidden="true">${Array.from({length:5},(_,i)=>`<i class="${i<r.hostility?'on':''}"></i>`).join('')}</span><b>${TENSION[r.hostility]}</b></span>`}
function relationsOverview(){
  return `<div class="tablewrap"><table class="rel"><thead><tr><th scope="col">House</th><th scope="col">Stance</th><th scope="col">Tension</th><th scope="col">Ties</th><th scope="col">Threat</th></tr></thead><tbody>${H.rivals.map(r=>{
    const t=tiesWith(r.name),groups=[...new Set(t.map(x=>x.group))];
    return `<tr><th scope="row"><span class="relname"><svg class="mini" viewBox="0 0 100 118" aria-hidden="true">${sigilSVG(r.sigil,'ov'+r.name)}</svg>${esc(r.name)}</span></th>
      <td>${stanceOf(r)}</td><td>${tensionMeter(r)}</td>
      <td>${groups.length?groups.map(gr=>`<span class="chip">${gr}${t.filter(x=>x.group===gr).length>1?' ×'+t.filter(x=>x.group===gr).length:''}</span>`).join(''):'<span class="muted">None</span>'}</td>
      <td>${atWar(r.name)?'<span class="hot">At war</span>':guards(r.name).length?'<span class="okc">Held in check</span>':r.hostility?`<span class="hot">${r.hostility*6}% a season</span>`:'<span class="muted">None</span>'}</td></tr>`}).join('')}</tbody></table></div>`;
}
/* rerolling a rival: only a house with no ties to yours, so nothing in your chronicle points at it */
function rerollBlock(r){
  if(H.realm&&!H.realm.yours&&H.realm.royal.name===r.name)return 'The royal house cannot be rerolled';
  if(tiesWith(r.name).length)return 'Bound to your house by ties. Only a house with no ties can be rerolled';
  if(H.ops.underway.some(x=>x.op.target===r.name)||(H.ops.defense||[]).some(d=>d.target===r.name))return 'An operation involving them is underway';
  if(H.realm&&H.realm.crisis&&H.realm.crisis.claimants.some(c=>c.key===r.name))return 'They are claiming the throne';
  return null;
}
function rerollHouse(n){
  const r=rival(n);if(!r||rerollBlock(r))return;replaceHouse(r);
}
function replaceHouse(r){
  const n=r.name;widowConsorts(w=>w.kind==='lord'&&w.house===n);
  const taken=new Set([H.house.name,H.realm&&H.realm.royal&&H.realm.royal.name].concat(H.rivals.map(x=>x.name)).concat((H.minors||[]).map(x=>x.name)));
  const sp=pick(SPECIES_KEYS);let pool=HOUSES_BY[sp].filter(x=>!taken.has(x));if(!pool.length)pool=HOUSES.filter(x=>!taken.has(x));if(!pool.length)return;
  const name=pick(pool),nsp=houseSp(name)||sp,sx=Math.random()<.7?'m':'f';
  H.realm.alliances=H.realm.alliances.filter(k=>!k.split('|').includes(n));H.realm.wars=H.realm.wars.filter(k=>!k.split('|').includes(n));
  Object.assign(r,{name,sp:nsp,seat:pick(SEATS_BY[nsp]),sigil:newSigil(),power:ri(1,3),hostility:0,lands:ri(4,7),agenda:pick(Object.keys(AGENDAS)),
    lord:{given:nameFor(sx,nsp),sex:sx,age:toSpAge(ri(28,64),nsp)}});
  if(Array.isArray(H.minors)){/* the old house's bannermen fade with it; the new house brings its own, one Estate per point of power */
    H.minors=H.minors.filter(x=>x.liege!==n);
    const tk=new Set([H.house.name,H.realm&&H.realm.royal&&H.realm.royal.name].concat(H.rivals.map(x=>x.name)).concat(H.minors.map(x=>x.name)).concat(ROYAL_HOUSES).filter(Boolean).map(x=>x.toLowerCase()));
    for(let i=0;i<r.power;i++)H.minors.push(newMinor(name,nsp,true,tk));
  }
  H.ops.board.forEach(o=>{if(o.target===n){o.target=name;o.title=o.title.split(n).join(name)}});
  if(leverage===n)leverage=null;if(houseMsg&&houseMsg.key===n)houseMsg=null;
  H.log.push({cycle:H.cycle,text:`House ${n} fades from the chronicle. House ${name} of ${r.seat} rises in its place.`});
}
function houseCard(r){
  const Rz=H.realm;
  const rels=H.rivals.filter(o=>o!==r&&relation(r.name,o.name)).map(o=>`<span class="${relation(r.name,o.name)==='war'?'hot':'okc'}">${relation(r.name,o.name)==='war'?'at war with':'allied with'} ${esc(o.name)}</span>`).join(' · ');
  const secrets=H.secrets.map((s,i)=>[s,i]).filter(([s])=>s.house===r.name);
  const lev=leverage===r.name;
  const wardBtn=i=>H.members.some(m=>m.hostage===r.name&&!m.dead)||H.hostageClaims.some(c=>c.house===r.name)?'':`<button class="sm" data-bm="${i}|ward">… for a ward</button>`;
  const secretHtml=secrets.length?`<div class="secrets">${lev?secrets.map(([s,i])=>`<div class="sec"><p style="margin:0">${esc(s.text)}.</p><div class="acts"><button class="sm" data-bm="${i}|gold">Blackmail for gold</button><button class="sm" data-bm="${i}|peace">… for peace</button><button class="sm" data-bm="${i}|marriage">… for a marriage</button>${wardBtn(i)}<button class="sm danger" data-expose="${i}">Expose at court</button></div></div>`).join('')+`<button class="sm" data-lev="">Close</button>`:`<button class="sm" data-lev="${esc(r.name)}">Use a secret (${secrets.length})</button>`}</div>`:'';
  const ties=tiesWith(r.name),groups=[...new Set(ties.map(x=>x.group))];
  const tieHtml=groups.length?groups.map(gr=>`<dt>${gr}</dt><dd><ul class="ties">${ties.filter(x=>x.group===gr).map(x=>`<li class="${x.tone}">${esc(x.text)}</li>`).join('')}</ul></dd>`).join(''):'';
  const hist=H.log.filter(l=>l.text.includes('House '+r.name)).slice(-3).reverse();
  return `<article class="hcard" id="house-${esc(r.name)}"><div class="hhead"><svg class="rsig" viewBox="0 0 100 118" aria-hidden="true">${sigilSVG(r.sigil,'h'+r.name)}</svg><div style="min-width:0;flex:1"><h3 style="display:flex;gap:8px;align-items:center"><input class="hedit nm" data-hname="${esc(r.name)}" value="House ${esc(r.name)}" aria-label="Name of House ${esc(r.name)}">${Rz.royal.name===r.name?'<span class="status young">Royal</span>':''}</h3>${houseMsg&&houseMsg.key===r.name?`<p class="hmsg" role="alert">${esc(houseMsg.text)}</p>`:''}<p class="muted" style="margin:0;font-size:15px">${r.lord.sex==='f'?'Lady':'Lord'} ${esc(r.lord.given)}, ${r.sp} · ${r.lord.age}${(()=>{const c=H.members.find(m=>!m.dead&&m.wedTo&&m.wedTo.kind==='lord'&&m.wedTo.house===r.name);return c?` · <span class="okc">wed to ${esc(c.given)} of your house</span>`:lordFree(r)?' · <span class="okc">unmarried, no heir</span>':''})()}</p><input class="hedit st" data-hseat="${esc(r.name)}" value="Seat: ${esc(r.seat)}" aria-label="Seat of House ${esc(r.name)}"></div></div>
    <div class="stance"><span class="eyebrow" style="color:var(--gold)">${stanceOf(r)}</span>${tensionMeter(r)}</div>
    <p class="threat">${threatLine(r)}</p>
    <dl class="opdl">${tieHtml||'<dt>Ties</dt><dd class="muted">None yet.</dd>'}</dl>
    <dl class="opdl theirs"><dt>Agenda</dt><dd>${AGENDAS[r.agenda]}</dd><dt>Strength</dt><dd>${powerHtml(r.name)} · ${r.lands} land${r.lands===1?'':'s'}</dd>${rels?`<dt>Realm</dt><dd>${rels}</dd>`:''}</dl>
    ${hist.length?`<details class="hist"><summary>Recent dealings</summary><ul>${hist.map(l=>`<li><span class="cy">${seasonOf(l.cycle)}, yr ${yearOf(l.cycle)}</span>${esc(l.text)}</li>`).join('')}</ul></details>`:''}
    <details class="hacts" data-fold="hacts-${esc(r.name)}" ${H.ui&&H.ui.folds&&H.ui.folds['hacts-'+r.name]?'open':''}><summary>Actions</summary><div class="acts"><button class="sm" data-calm="${esc(r.name)}" ${H.influence>=2&&r.hostility?'':'disabled'}>Ease tensions · 2 influence</button><button class="sm" data-gift="${esc(r.name)}" ${r.hostility&&!court().gifts[r.name]&&H.gold>=giftCost(r)?'':'disabled'} title="${court().gifts[r.name]?'Already sent a gift this season':r.hostility?'−1 tension, once a season':'No tension to ease'}">Send a gift · ${giftCost(r)} gold</button>${dipActs(r)}${tradeActs(r)}
      <span class="lbl">Heraldry</span><button class="sm" data-hsigil="${esc(r.name)}">Redraw sigil</button><button class="sm" data-sgopen="rival" data-sgname="${esc(r.name)}">Edit sigil</button>${(()=>{const why=rerollBlock(r);return `<button class="sm" data-rerollhouse="${esc(r.name)}" ${why?`disabled title="${esc(why)}"`:'title="Replace this house with a new one"'}>Reroll house</button>`})()}</div></details>${warConfirm(r)}${secretHtml}</article>`;
}

/* ---------- events ---------- */
function doRoll(stat,skill){
  const m=mem(sel);const base=m.st[stat],bonus=(stat==='Might'?wVal(m.gear.weapon):0)+gearBonus(m,stat),target=base+bonus,roll=1+Math.floor(Math.random()*10);
  lastRoll={id:m.id,stat,skill,base,bonus,target,roll,ok:roll===1||(roll!==10&&roll<=target)};render();
}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&sigilEdit){sigilEdit=null;render()}});
document.addEventListener('click',e=>{
  const t=e.target.closest('button,[data-sel],[data-jump],.sgback');if(!t)return;
  if(t.dataset.sec){section=t.dataset.sec;render();return}
  if(t.dataset.oath){const [k,id]=t.dataset.oath.split('|');oathAct(minorById(id),k==='yes');save();render();return}
  if(t.dataset.feud){const [k,i,a]=t.dataset.feud.split('|');feudAct(k,(H.feuds||[])[+i],a);save();render();return}
  if(t.dataset.xdiss){const [k,a]=t.dataset.xdiss.split('|');
    if(k==='send'){launchMinorDiss();save();return}
    if(k==='cancel')dissMinor=null;
    else if(k==='pick'&&dissMinor){const id=+a;dissMinor.team=dissMinor.team.includes(id)?dissMinor.team.filter(z=>z!==id):dissMinor.team.concat(id).slice(-3)}
    render();return}
  if(t.dataset.minor){const [k,id,a]=t.dataset.minor.split('|');minorAct(k,id,a);save();render();return}
  if(t.dataset.sel!=null){sel=+t.dataset.sel;if(t.dataset.go)section=t.dataset.go;lastRoll=null;render();if(t.dataset.go)window.scrollTo({top:0});return}
  if(t.dataset.sgopen){sigilEdit={kind:t.dataset.sgopen,name:t.dataset.sgname||null};render();return}
  if(t.dataset.sgpart){setSigilPart(t.dataset.sgpart,t.dataset.sgval);render();return}
  if(t.dataset.sgclose){if(t.classList.contains('sgback')&&e.target!==t)return;sigilEdit=null;render();return}
  if(t.dataset.rerollhouse){rerollHouse(t.dataset.rerollhouse);render();return}
  if(t.dataset.hsigil!=null){const n=t.dataset.hsigil,r=rival(n);if(r)r.sigil=newSigil();if(H.realm.royal.name===n&&!H.realm.yours)H.realm.royal.sigil=r?r.sigil:newSigil();render();return}
  if(t.dataset.routall){H.ops.routChain=H.cycle;nextRout();render();const el=document.getElementById('routing');if(el)el.scrollIntoView({behavior:'smooth',block:'start'});return}
  if(t.dataset.routstop){H.ops.defense=H.ops.defense.filter(d=>!d.rout);H.ops.routChain=null;render();return}
  if(t.dataset.exch){const [d,n]=t.dataset.exch.split('|');exchange(d,+n);render();return}
  if(t.dataset.extraop){extraOperation();render();return}
  if(t.dataset.reroll){if(H.ops.board.length){H.ops.board=genBoard();planning=null;planTeam=[]}render();return}
  if(t.dataset.invest!=null){invest(H.lands[+t.dataset.invest]);render();return}
  if(t.dataset.train){buyTraining(mem(sel),t.dataset.train);render();return}
  if(t.dataset.untrain){cancelTraining(mem(sel),t.dataset.untrain);render();return}
  if(t.dataset.roll){const [s,k]=t.dataset.roll.split('|');doRoll(s,k);return}
  if(t.dataset.wound){const m=mem(sel);m.wounds=clamp(m.wounds+(+t.dataset.wound),0,maxWounds(m));render();return}
  if(t.dataset.asmark){const [id,mk]=t.dataset.asmark.split('|'),op=H.ops.board.find(o=>o.id===+id);if(op)setAssassinMark(op,mk);render();return}
  if(t.dataset.plan!=null){planning=t.dataset.plan===''?null:+t.dataset.plan;planTeam=[];render();return}
  if(t.dataset.pick!=null){const id=+t.dataset.pick;planTeam=planTeam.includes(id)?planTeam.filter(x=>x!==id):planTeam.concat(id);render();return}
  if(t.dataset.launch){launch(+t.dataset.launch);return}
  if(t.dataset.stageroll){const [a,b]=t.dataset.stageroll.split('|');rollStage(+a,+b);return}
  if(t.dataset.closeop){closeOp(+t.dataset.closeop);return}
  if(t.dataset.aidsplit){const [a,b]=t.dataset.aidsplit.split('|');resolveSplit(+a,b==='keep');return}
  if(t.dataset.ransom!=null){const c=H.captives.splice(+t.dataset.ransom,1)[0];if(c){H.gold+=c.ransom;H.log.push({cycle:H.cycle,text:`House ${c.house} paid ${c.ransom} gold to free ${c.name}.`})}render();return}
  if(t.dataset.payransom){const m=mem(+t.dataset.payransom);if(m&&m.captive&&H.gold>=m.captive.ransom){H.gold-=m.captive.ransom;H.log.push({cycle:H.cycle,text:`Paid ${m.captive.ransom} gold to House ${m.captive.house} for ${m.given}'s freedom.`});m.captive=null}render();return}
  if(t.id==='endCycle'){endCycle();window.scrollTo({top:0});return}
  if(t.dataset.bm){const [i,d]=t.dataset.bm.split('|');blackmail(+i,d);return}
  if(t.dataset.expose!=null){expose(+t.dataset.expose);return}
  if(t.dataset.lev!=null){leverage=t.dataset.lev||null;render();return}
  if(t.dataset.calm){calm(t.dataset.calm);return}
  if(t.dataset.gift){sendGift(t.dataset.gift);return}
  if(t.dataset.bribe){bribe();return}
  if(t.dataset.royal){const s=$('ra-'+t.dataset.royal),gl=$('ra-grantland');royalAct(t.dataset.royal,s?s.value:null,gl?gl.value:null);return}
  if(t.dataset.feast){const s=$('feasthost');if(s)holdFeast(t.dataset.feast,+s.value);return}
  if(t.dataset.envoy!=null){if(!t.dataset.envoy){envoy=null;render();return}const [k,n,a]=t.dataset.envoy.split('|');envoy={kind:k,house:n,against:a||null,who:null};pendingWar=null;render();const el=$('envoyPanel');if(el)el.scrollIntoView({behavior:'smooth',block:'start'});return}
  if(t.dataset.sendenvoy){sendEnvoy(+t.dataset.sendenvoy);return}
  if(t.dataset.treaty!=null){if(!t.dataset.treaty){treaty=null;render();return}treaty={house:t.dataset.treaty,gold:0,land:0,ward:false,marriage:false,dissolve:false,team:[]};envoy=null;pendingWar=null;render();const el=$('treatyPanel');if(el)el.scrollIntoView({behavior:'smooth',block:'start'});return}
  if(t.dataset.tterm){if(treaty){const [k,v]=t.dataset.tterm.split('|');treaty[k]=k==='ward'||k==='marriage'||k==='dissolve'?v==='1':+v;if(k==='dissolve'&&treaty.dissolve)Object.assign(treaty,{gold:0,land:0,ward:false,marriage:false})}render();return}
  if(t.dataset.tpick!=null){if(treaty){const id=+t.dataset.tpick;treaty.team=treaty.team.includes(id)?treaty.team.filter(x=>x!==id):treaty.team.concat(id).slice(-3)}render();return}
  if(t.dataset.tsend){launchTreaty();return}
  if(t.dataset.dyes!=null){acceptDemand(+t.dataset.dyes);return}
  if(t.dataset.dno!=null){refuseDemand(+t.dataset.dno);return}
  if(t.dataset.dcancel){pendingDissolve=null;render();return}
  if(t.dataset.toll!=null){H.dip.toll=+t.dataset.toll;H.log.push({cycle:H.cycle,text:`House ${H.house.name} sets ${['no tolls','low tolls','high tolls'][H.dip.toll]} on its roads.`});render();return}
  if(t.dataset.embargo){toggleEmbargo(t.dataset.embargo);return}
  if(t.dataset.cutroute!=null){cancelRoute(+t.dataset.cutroute);return}
  if(t.dataset.warask){pendingWar={house:t.dataset.warask,card:t.dataset.warask};render();return}
  if(t.dataset.joinwar){const [w,x]=t.dataset.joinwar.split('|');pendingWar={house:x,with:w,card:w};render();return}
  if(t.dataset.wargo){if(pendingWar){const p=pendingWar;pendingWar=null;declareWar(p.house,p.with?{cause:`Joined House ${p.with}'s war against them`,with:p.with}:{})}render();return}
  if(t.dataset.warno){pendingWar=null;render();return}
  if(t.dataset.answer!=null){answerCall(+t.dataset.answer);return}
  if(t.dataset.refuse!=null){refuseCall(+t.dataset.refuse);return}
  if(t.dataset.breakally){pendingBreak=t.dataset.breakally;render();return}
  if(t.dataset.breakyes){breakAlliance(t.dataset.breakyes);return}
  if(t.dataset.breakno){pendingBreak=null;render();return}
  if(t.dataset.petition){petition();return}
  if(t.dataset.office){seekOffice(t.dataset.office);return}
  if(t.dataset.back){backClaim(t.dataset.back);return}
  if(t.dataset.claim){pressClaim();return}
  if(t.dataset.arrange){const i=+t.dataset.arrange,sl=$('match-'+i),o=H.offers[i],m=sl&&mem(+sl.value);if(o&&m)arrangeMatch(i,m.id,suitPick[o.uid+'|'+(m.sex==='m'?'f':'m')]||0);return}
  if(t.dataset.marryout){const [i,how]=t.dataset.marryout.split('|'),sl=$('match-'+i);if(sl)marryOut(+i,+sl.value,how);return}
  if(t.dataset.mmode){const [k,v]=t.dataset.mmode.split('|');matchMode[k]=v;render();return}
  if(t.dataset.suit){const p=t.dataset.suit.split('|');suitPick[p[0]+'|'+p[1]]=+p[2];render();return}
  if(t.dataset.press){const [i,h]=t.dataset.press.split('|');pressDispute(+i,h);return}
  if(t.dataset.decline){declineMatch(+t.dataset.decline);return}
  if(t.dataset.ward){demandWard(+t.dataset.ward);return}
  if(t.dataset.jump){const el=document.getElementById(t.dataset.jump);const d=document.querySelector('details[data-fold="houses"]');if(d&&!d.open)d.open=true;if(el)el.scrollIntoView({behavior:'smooth',block:'start'});return}
  if(t.dataset.adopt){adoptWard(+t.dataset.adopt);return}
  if(t.dataset.relook){const m=mem(+t.dataset.relook);if(m)m.look=(Math.floor(Math.random()*4294967295)>>>0)||1;render();return}
  if(t.dataset.hire!=null){hireSword(+t.dataset.hire);render();return}
  if(t.dataset.levy){if(t.dataset.levy==='1')raiseLevy();else disbandLevy();render();return}
  if(t.dataset.garrison){const [i,on]=t.dataset.garrison.split('|');setGarrison(H.lands[+i],on==='1');render();return}
  if(t.dataset.buy){const k=t.dataset.buy.indexOf('|');buy(t.dataset.buy.slice(0,k),t.dataset.buy.slice(k+1));return}
  if(t.dataset.sell!=null){sell(+t.dataset.sell);return}
  if(t.dataset.give!=null){const i=+t.dataset.give,it=H.armory[i],sl=$('give-'+i),m=sl&&mem(+sl.value);if(it&&m){equip(m,it.slot,it.name);H.log.push({cycle:H.cycle,text:`${m.given} takes up the ${it.name}.`})}render();return}
  if(t.dataset.return){const [i,k]=t.dataset.return.split('|');returnWard(+i,k);return}
  if(t.id==='newSigil'){R=Math.random;H.house.sigil=newSigil();render();return}
  if(t.id==='savesBtn'){savesOpen=!savesOpen;pendingDelete=null;t.setAttribute('aria-expanded',savesOpen);renderSaves();return}
  if(t.dataset.closesaves){savesOpen=false;$('savesBtn').setAttribute('aria-expanded','false');renderSaves();return}
  if(t.dataset.loadslot){switchSlot(t.dataset.loadslot);renderSaves();return}
  if(t.dataset.newslot){newGameSlot();renderSaves();return}
  if(t.dataset.delslot){pendingDelete=t.dataset.delslot;renderSaves();return}
  if(t.dataset.delslotYes){deleteSlot(t.dataset.delslotYes);return}
  if(t.dataset.delslotNo){pendingDelete=null;renderSaves();return}
  if(t.id==='newHouse'){pendingConfirm=true;$('confirmBox').innerHTML=`<div class="confirm"><span>Found a new House in this save slot? The current House and everyone in it will be lost. To keep it, use Saves → Start a new House in a new slot.</span><button class="danger" id="yesNew">Found a new House</button><button id="noNew">Keep this House</button></div>`;return}
  if(t.id==='yesNew'){H=generate((Math.random()*4294967295)>>>0);ensureState();planning=null;planTeam=[];sel=H.members.find(m=>m.ruler).id;lastRoll=null;$('confirmBox').innerHTML='';render();{const meta=readMeta(),sl=meta.slots.find(x=>x.id===activeSlot);if(sl&&/^House /.test(sl.name)){sl.name='House '+H.house.name;writeMeta(meta)}}save();renderSaves();return}
  if(t.id==='noNew'){$('confirmBox').innerHTML='';return}
});
document.addEventListener('change',e=>{const t=e.target;if(t&&t.dataset&&t.dataset.mpick&&minorUI){minorUI[t.dataset.mpick]=+t.value;render()}});
document.addEventListener('toggle',e=>{if(e.target.matches&&e.target.matches('details.ravens'))ravensOpen=e.target.open},true);
document.addEventListener('toggle',e=>{const d=e.target;if(d&&d.dataset&&d.dataset.fold&&H){H.ui=H.ui||{};H.ui.folds=H.ui.folds||{};H.ui.folds[d.dataset.fold]=d.open;save()}},true);
document.addEventListener('keydown',e=>{if(e.target&&(e.target.id==='hname'||e.target.classList.contains('lname'))&&e.key==='Enter'){e.preventDefault();e.target.blur()}});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('g.node,g.hnode')){e.preventDefault();e.target.dispatchEvent(new MouseEvent('click',{bubbles:true}))}});
window.addEventListener('resize',()=>{try{fitNames()}catch(e){}});
document.addEventListener('input',e=>{
  if(e.target&&e.target.id==='hname')fitArea(e.target,22);else if(e.target&&e.target.matches&&e.target.matches('input.hedit.nm'))fitInput(e.target,12);
  const t=e.target,m=H&&mem(sel);
  if(t.dataset.edit&&m){m[t.dataset.edit]=t.value;const b=document.querySelector(`ul.roster button[data-sel="${m.id}"]`);if(b){b.querySelector('.rn').textContent=m.given;}save();return}
  if(t.dataset.gear&&m&&t.tagName==='TEXTAREA'){m.gear[t.dataset.gear]=t.value;save();return}
});
document.addEventListener('change',e=>{
  const t=e.target,m=H&&mem(sel);
  if(t.dataset.hname!=null){tryRenameHouse(t.dataset.hname,t.value,t.dataset.hname);render();return}
  if(t.dataset.hseat!=null){const n=t.dataset.hseat,r=rival(n)||(H.realm.royal.name===n?H.realm.royal:null);if(r){const v=t.value.replace(/^seat:\s*/i,'').trim().slice(0,40);if(v)r.seat=v}render();return}
  if(t.dataset.gear&&m&&t.tagName==='SELECT'){equip(m,t.dataset.gear,t.value);render();return}
  if(t.dataset.rename){renameSlot(t.dataset.rename,t.value);return}
  if(t.dataset.lname){renameHold(t.dataset.lname,t.value);render();return}
  if(t.dataset.match){matchPick[t.dataset.match]=+t.value;render();return}
  if(t.dataset.wedwho){if(envoy)envoy.who=+t.value;render();return}
  if(t.dataset.edit){render();return}
  if(t.id==='hname'){H.house.name=t.value.replace(/^\s*house\s+/i,'').trim()||H.house.name;render()}
  if(t.id==='hwords'){H.house.words=t.value.replace(/[“”"]/g,'').trim()||H.house.words;render()}
  if(t.id==='hseat'){const old=H.house.seat,nw=t.value.replace(/^\s*seat:\s*/i,'').trim()||old;H.house.seat=nw;H.members.forEach(m=>{if(m.title.includes(old))m.title=m.title.replace(old,nw)});render()}
});

/* ---------- start ---------- */
function start(d){
  if(d&&d.H){H=d.H;sel=d.sel||0;section=d.section||'house';activeSlot=d.activeSlot||readMeta().active}
  else if(!load()){H=generate((Math.random()*4294967295)>>>0);sel=H.members.find(m=>m.ruler).id}
  ensureState();
  render();
}
try{window.claude?.hot?.snapshot(()=>({H,sel,section,activeSlot}))}catch(e){}
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
</script>
