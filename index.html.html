  }],
  ['war',2,say=>{
    const pairs=[];H.rivals.forEach((a,i)=>H.rivals.slice(i+1).forEach(b=>{if(relation(a.name,b.name)!=='ally'&&relation(a.name,b.name)!=='war')pairs.push([a,b])}));if(!pairs.length)return false;
    const [a,b]=pick(pairs);setRel(a.name,b.name,'war');say(`House ${a.name} marches on House ${b.name}. The realm is at war.`,'warn');
  }],
  ['decree',3,say=>{
    const Rz=H.realm;if(Rz.yours||!Rz.king)return false;const K=crownWord(Rz.king)+' '+Rz.king.given;
    const d=pick(['tax','tourney','grant','traitor','summons']);
    if(d==='tax'){if(Rz.favor>=7){say(`${K} levies a war tax. Your standing at court spares you.`,'good');return}const g=Math.min(H.gold,4+Math.floor(H.cycle/2));H.gold-=g;say(`${K} levies a war tax. You pay ${g} gold.`,'bad')}
    else if(d==='tourney'){const champ=H.members.filter(canServe).sort((a,b)=>(b.st.Might+wVal(b.gear.weapon))-(a.st.Might+wVal(a.gear.weapon)))[0];
      if(!champ){say(`${K} holds a royal tourney. House ${H.house.name} sends no champion.`,'');return}
      const t=champ.st.Might+wVal(champ.gear.weapon),r=1+Math.floor(Math.random()*10);
      if(r===1||r!==10&&r<=t){Rz.favor=Math.min(10,Rz.favor+1);H.gold+=6;say(`${K} holds a royal tourney. ${champ.given} rides for your house and wins (rolled ${r} vs ${t}): +6 gold and royal favor.`,'good')}
      else say(`${K} holds a royal tourney. ${champ.given} is unhorsed in the second round (rolled ${r} vs ${t}).`,'')}
    else if(d==='grant'){if(Rz.favor>=7){const L={name:pick(LAND_A)+pick(LAND_B),tier:'Village',income:2,peasants:ri(30,60),from:'the crown',cycle:H.cycle};H.lands.push(L);say(`${K} grants your house the Village of ${L.name} for its loyalty.`,'good')}
      else{const r=pick(H.rivals);r.lands++;r.power=Math.min(3,r.power+(Math.random()<.4?1:0));say(`${K} grants lands to House ${r.name}, a royal favorite.`,'')}}
    else if(d==='traitor'){const r=pick(H.rivals);r.power=Math.max(1,r.power-1);let t=`${K} names House ${r.name} traitors and strips them of honors.`;
      if(H.pacts.some(p=>p.house===r.name)){Rz.favor=Math.max(0,Rz.favor-1);t+=' Your agreements with them cost you favor at court.'}say(t,'warn')}
    else{if(Rz.favor>=4){H.influence++;say(`${K} summons the lords to court. Your house is seated near the throne: +1 influence.`,'good')}else say(`${K} summons the lords to court. Your house is seated below the salt.`,'')}
  }],
  ['betrayal',2,say=>{
    const pacts=H.pacts.filter(p=>{const r=rival(p.house);return r&&(r.hostility>0||r.agenda!=='wealth')});
    const allies=H.realm.alliances.slice();
    if(pacts.length&&Math.random()<.6){const p=pick(pacts),r=rival(p.house);H.pacts.splice(H.pacts.indexOf(p),1);bump(r,1);say(`House ${p.house} tears up its ${p.kind.toLowerCase()} with you.`,'bad');return}
    if(allies.length){const k=pick(allies),[a,b]=k.split('|');setRel(a,b,'war');say(`House ${a} betrays its ally House ${b}. The alliance ends in blood.`,'warn');return}
    return false;
  }]
];
function rivalStrike(r,say){
  if(hasPeace(r.name))return;
  const ag=r.agenda;
  if(ag==='land'&&Math.random()<.45){const free=H.lands.filter(l=>!raidOn(l));if(free.length){const L=pick(free);H.ops.defense.push(genSiege(r,L));say(`House ${r.name} marches on your ${L.tier.toLowerCase()} of ${L.name}. Defend it this season or lose it.`,'warn');return}}
  if(ag==='revenge'||ag==='land'&&Math.random()<.3){const pool=H.members.filter(m=>!m.dead&&!m.captive&&isAdult(m));if(!pool.length)return;const m=pick(pool),roll=1+Math.floor(Math.random()*10);
    const see=m.st.Insight+(fxS(m).taster||0)+gearBonus(m,'Insight');if(roll===1||roll!==10&&roll<=see){say(`An assassin of House ${r.name} comes for ${m.given}, who sees it coming (needed ${see}, rolled ${roll}).`,'warn');return}
    say(`An assassin of House ${r.name} strikes at ${m.given}, who ${hurt(m,2)}.`,'bad');return}
  if(ag==='crown'){H.realm.favor=Math.max(0,H.realm.favor-1);say(`House ${r.name} slanders your house at court. Royal favor falls.`,'bad');return}
  const g=Math.min(H.gold,ri(4,9));H.gold-=g;say(`Raiders in the colors of House ${r.name} burn your storehouses: −${g} gold.`,'bad');
}
function realmTurn(){
  const news=[],say=(t,tone)=>news.push({t,tone}),Rz=H.realm;
  if(seasonOf(H.cycle+1)==='Winter'){if(Rz.king&&!Rz.yours)Rz.king.age++;if(Rz.heir)Rz.heir.age++;H.rivals.forEach(r=>{r.lord.age++;if(r.hostility&&Math.random()<.3)r.hostility--})}
  if(Rz.crisis)resolveCrisis(say);
  else if(Rz.king&&!Rz.yours){const k=Rz.king,p=.015+Math.max(0,k.age-55)*.006+(3-k.health)*.04;
    if(Math.random()<p)kingDies(say,pick(DEATHS));
    else if(k.health>1&&Math.random()<.07){k.health--;say(`${crownWord(k)} ${k.given} has fallen ill.`,'warn')}}
  /* wars grind on: the stronger side takes land, and some end in peace */
  Rz.wars.slice().forEach(w=>{const [a,b]=w.split('|').map(rival);if(!a||!b)return;
    const win=a.power+Math.random()*3>=b.power+Math.random()*3?a:b,lose=win===a?b:a;
    if(Math.random()<.3){setRel(a.name,b.name,null);say(`Houses ${a.name} and ${b.name} make peace.`,'');return}
    if(lose.lands>0){lose.lands--;win.lands++;if(Math.random()<.5)say(`House ${win.name} takes land from House ${lose.name}.`,'')}else lose.power=Math.max(1,lose.power-1)});
  const n=Math.random()<.5?1:2;
  for(let i=0;i<n;i++){let tries=0;while(tries++<6){const tot=EVENTS.reduce((a,e)=>a+e[1],0);let x=Math.random()*tot,ev=EVENTS[0];for(const e of EVENTS){x-=e[1];if(x<=0){ev=e;break}}if(ev[2](say)!==false)break}}
  H.rivals.forEach(r=>{if(Math.random()<r.hostility*.06)rivalStrike(r,say)});
  if(Rz.office&&Rz.favor<3&&!Rz.yours){say(`With royal favor gone, you are stripped of the office of ${OFFICES[Rz.office][0]}.`,'bad');Rz.office=null}
  return news;
}

/* ---------- leverage and court ---------- */
function blackmail(i,demand){
  const s=H.secrets[i];if(!s)return;const r=rival(s.house);H.secrets.splice(i,1);let t;
  if(demand==='gold'){const g=6+2*(r?r.power:1);H.gold+=g;t=`House ${s.house} pays ${g} gold to keep a secret buried.`}
  else if(demand==='peace'){H.pacts.push({house:s.house,kind:'Pact of peace (coerced)'});if(r)r.hostility=0;t=`House ${s.house} swears peace rather than see its secret told.`}
  else if(demand==='ward'){if(!H.hostageClaims.some(c=>c.house===s.house)&&!H.members.some(m=>m.hostage===s.house&&!m.dead))H.hostageClaims.push({house:s.house,why:'Yielded to blackmail'});t=`House ${s.house} agrees to send a child as your ward. Claim them in Bloodlines.`}
  else{H.offers.push({house:s.house,cycle:H.cycle});t=`House ${s.house} offers a marriage to buy your silence.`}
  bump(r,1);H.log.push({cycle:H.cycle,text:'Blackmail. '+t+' They will resent it.'});leverage=null;render();
}
function expose(i){
  const s=H.secrets[i];if(!s)return;const r=rival(s.house);H.secrets.splice(i,1);
  if(r)r.power=Math.max(1,r.power-1);bump(r,2);H.realm.favor=Math.min(10,H.realm.favor+1);H.influence++;
  H.log.push({cycle:H.cycle,text:`You expose House ${s.house} at court: ${s.text}. Their power falls; your favor and influence rise.`});leverage=null;render();
}
function calm(n){const r=rival(n);if(!r||H.influence<2||!r.hostility)return;H.influence-=2;r.hostility--;H.log.push({cycle:H.cycle,text:`Gifts and kind words ease tensions with House ${n}.`});render()}
function petition(){if(H.influence<3||H.realm.favor>=10||H.realm.yours||!H.realm.king)return;H.influence-=3;H.realm.favor++;H.log.push({cycle:H.cycle,text:'You petition the crown and win royal favor.'});render()}
function seekOffice(k){const Rz=H.realm;const free=Rz.yours;if(!free&&(H.influence<6||Rz.favor<5||!Rz.king))return;if(!free)H.influence-=6;Rz.office=k;H.log.push({cycle:H.cycle,text:`A member of House ${H.house.name} is named ${OFFICES[k][0]}.`});render()}
function backClaim(key){const C=H.realm.crisis;if(!C||C.backed||C.own||H.influence<3)return;H.influence-=3;C.backed=key;const c=C.claimants.find(x=>x.key===key);if(c)c.str+=3;render()}
function pressClaim(){const C=H.realm.crisis;if(!C||C.backed||C.own||!canClaim())return;const r0=ruler();
  C.own=true;C.claimants.push({key:'you',label:`${r0.given} of House ${H.house.name}`,str:2+Math.floor(H.influence/3)+H.lands.length+Math.floor(r0.st.Insight/3)});
  H.rivals.forEach(r=>bump(r,1));H.log.push({cycle:H.cycle,text:`House ${H.house.name} presses its own claim to the throne. Every great house takes note.`});render()}
const canClaim=()=>H.influence>=10||H.realm.favor>=7;

/* ---------- power rankings and the web of houses ---------- */
const BINDING=p=>p.kind==='Marriage alliance'||p.kind.startsWith('Pact of peace');
function playerPower(){const hale=living().filter(m=>isAdult(m)&&!m.captive).length;return clamp(Math.round(hale/3),1,3)}
function powerOf(n){return n===H.house.name?playerPower():(rival(n)||{power:1}).power}
function landsOf(n){return n===H.house.name?H.lands.length+1:(rival(n)||{lands:0}).lands}
function alliesOf(n){
  if(n===H.house.name)return [...new Set(H.pacts.filter(BINDING).map(p=>p.house))].filter(x=>rival(x));
  const a=H.rivals.filter(o=>o.name!==n&&relation(n,o.name)==='ally').map(o=>o.name);
  if(H.pacts.some(p=>p.house===n&&BINDING(p)))a.push(H.house.name);
  return a;
}
function rankings(){
  const names=[H.house.name].concat(H.rivals.map(r=>r.name));
  return names.map(n=>{const allies=alliesOf(n),ap=allies.reduce((a,x)=>a+powerOf(x),0),crown=H.realm&&H.realm.royal.name===n?3:0,pw=powerOf(n),ln=landsOf(n);
    return {name:n,you:n===H.house.name,power:pw,lands:ln,allies,ap,crown,score:pw*3+ln+ap+crown}})
    .sort((a,b)=>b.score-a.score||b.power-a.power).map((x,i)=>Object.assign(x,{rank:i+1}));
}
function rankingsTable(){
  const R=rankings(),top=Math.max(...R.map(x=>x.score),1);
  return `<p class="muted" style="font-size:15px;margin:0 0 10px">Score = power × 3, plus lands held (your seat counts as one), plus the power of every ally, plus 3 for holding the throne. Your house’s power comes from how many members of age are free to fight.</p>
  <ol class="ranks">${R.map(x=>{const sg=x.you?H.house.sigil:(rival(x.name)||{}).sigil;
    return `<li class="${x.you?'you':''}"><span class="rk">${x.rank}</span>${sg?`<svg class="mini" viewBox="0 0 100 118" aria-hidden="true">${sigilSVG(sg,'rk'+x.name)}</svg>`:''}
      <span class="rname"><b>House ${esc(x.name)}${x.you?' <span class="muted">(you)</span>':''}</b><span class="muted">Power ${'◆'.repeat(x.power)} · ${x.lands} land${x.lands===1?'':'s'}${x.allies.length?' · allied with '+x.allies.map(esc).join(', '):''}${x.crown?' · holds the throne':''}</span></span>
      <span class="rbar" aria-hidden="true"><i style="width:${Math.round(x.score/top*100)}%"></i></span><b class="rscore">${x.score}</b></li>`}).join('')}</ol>`;
}
function webView(){
  const R=rankings(),rk=Object.fromEntries(R.map(x=>[x.name,x.rank])),Rz=H.realm;
  const W=680,Ht=600,cx=W/2,cy=Ht/2,rad=220,names=[H.house.name].concat(H.rivals.map(r=>r.name)),pos={};
  names.forEach((n,i)=>{const a=-Math.PI/2+i*2*Math.PI/names.length;pos[n]=[cx+rad*Math.cos(a),cy+rad*Math.sin(a)]});
  const holder=Rz.yours?H.house.name:(pos[Rz.royal.name]?Rz.royal.name:null);
  const lerp=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t];
  let edges='',labels='',nodes='';
  /* rival alliances and wars */
  H.rivals.forEach((a,i)=>H.rivals.slice(i+1).forEach(b=>{const rel=relation(a.name,b.name);if(!rel)return;const [x1,y1]=pos[a.name],[x2,y2]=pos[b.name];
    edges+=`<line class="e-${rel}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"><title>Houses ${esc(a.name)} and ${esc(b.name)}: ${rel==='war'?'at war':'allied'}</title></line>`}));
  /* your house and each rival: tension, treaties, marriages, wards */
  const me=pos[H.house.name];
  H.rivals.forEach(r=>{const p=pos[r.name],g=guards(r.name).length,ties=[...new Set(tiesWith(r.name).map(t=>t.group))];
    const cls=g?'e-bound':'e-t'+r.hostility;
    edges+=`<line class="e-you ${cls}" x1="${me[0]}" y1="${me[1]}" x2="${p[0]}" y2="${p[1]}"><title>${esc(stanceOf(r))}, ${TENSION[r.hostility]}${ties.length?': '+ties.join(', '):''}</title></line>`;
    const [lx,ly]=lerp(me,p,.6);
    labels+=`<text class="elab ${cls}" x="${lx}" y="${ly-4}">${esc(TENSION[r.hostility])}</text>${ties.length?`<text class="elab sub" x="${lx}" y="${ly+11}">${esc(ties.join(' · '))}</text>`:''}`});
  /* the crown at the center */
  if(holder){const [x,y]=pos[holder];edges+=`<line class="e-throne" x1="${cx}" y1="${cy}" x2="${x}" y2="${y}"><title>House ${esc(holder)} holds the throne</title></line>`}
  if(!Rz.yours){edges+=`<line class="e-favor" x1="${cx}" y1="${cy}" x2="${me[0]}" y2="${me[1]}"><title>Royal favor ${Rz.favor} of 10</title></line>`;
    const [fx,fy]=lerp([cx,cy],me,.5);labels+=`<text class="elab favor" x="${fx+8}" y="${fy}" text-anchor="start">Favor ${Rz.favor}</text>`}
  const k=Rz.king;
  nodes+=`<g class="crownnode"><circle cx="${cx}" cy="${cy}" r="58"/>
    <path transform="translate(${cx-18} ${cy-44})" d="M0 22 L4 4 L11 14 L18 0 L25 14 L32 4 L36 22 Z"/>
    ${holder?'':`<svg x="${cx-14}" y="${cy-20}" width="28" height="33" viewBox="0 0 100 118">${sigilSVG(Rz.royal.sigil,'wroyal')}</svg>`}
    <text class="cn" x="${cx}" y="${holder?cy+2:cy+28}">${k?crownWord(k)+' '+esc(k.given):'Empty throne'}</text>
    <text class="cs" x="${cx}" y="${holder?cy+18:cy+43}">${holder?'see the gold line':'House '+esc(Rz.royal.name)}</text></g>`;
  names.forEach(n=>{const [x,y]=pos[n],you=n===H.house.name,sg=you?H.house.sigil:rival(n).sigil,r=you?40:34;
    nodes+=`<g class="hnode ${you?'you':''}" ${you?'':`data-jump="house-${esc(n)}" tabindex="0" role="button" aria-label="House ${esc(n)}, rank ${rk[n]}"`}>
      <circle cx="${x}" cy="${y}" r="${r}"/><svg x="${x-r*.5}" y="${y-r*.62}" width="${r}" height="${r*1.18}" viewBox="0 0 100 118">${sigilSVG(sg,'w'+n)}</svg>
      ${(()=>{const lab=you?'Your house':'House '+n,fs=Math.max(9,Math.min(13,Math.floor(170/(lab.length*.62))));return `<text class="hn" x="${x}" y="${y+r+16}" style="font-size:${fs}px"${lab.length*fs*.62>180?' textLength="180" lengthAdjust="spacingAndGlyphs"':''}>${esc(lab)}</text>`})()}<text class="hr" x="${x}" y="${y+r+31}">#${rk[n]} in power</text></g>`});
  return `<div class="webwrap"><svg class="relweb" viewBox="0 0 ${W} ${Ht}" role="img" aria-label="Web of the great houses">${edges}${labels}${nodes}</svg></div>
    <div class="legend"><span><i class="l-throne"></i>Holds the throne</span><span><i class="l-favor"></i>Your royal favor</span><span><i class="l-ally"></i>Allied</span><span><i class="l-war"></i>At war</span><span><i class="l-bound"></i>Bound to you by treaty, marriage or ward</span><span><i class="l-calm"></i>Cordial to wary</span><span><i class="l-hot"></i>Hostile to blood feud</span></div>
    <p class="muted" style="font-size:14px;margin:8px 0 0;text-align:center">Choose a house to jump to its details.</p>`;
}
function foldOpen(k){return !(H.ui&&H.ui.folds&&H.ui.folds[k]===false)}

function realmView(){
  const Rz=H.realm,k=Rz.king;
  const news=H.news.length?`<section class="pane fold "><details data-fold="news" ${foldOpen('news')?'open':''}><summary><h2>Ravens of ${seasonOf(H.cycle)}, year ${yearOf(H.cycle)}</h2><span class="muted">${H.news.length} message${H.news.length>1?'s':''}</span></summary><div class="foldbody"><ul class="news">${H.news.map(n=>`<li class="${n.tone}">${esc(n.t)}</li>`).join('')}</ul></div></details></section>`:'';
  const health=k?['','Ailing','Frail','Hale'][k.health]:'';
  const crown=`<section class="pane fold "><details data-fold="crown" ${foldOpen('crown')?'open':''}><summary><h2>The Crown</h2></summary><div class="foldbody"><div class="crownrow"><svg class="rsig big" viewBox="0 0 100 118" aria-hidden="true">${sigilSVG(Rz.royal.sigil,'royal')}</svg><div style="min-width:0">
    ${k?`<p class="kname">${crownWord(k)} ${esc(k.given)}</p><p class="muted" style="margin:0">House ${esc(Rz.royal.name)} · age ${k.age} · ${health}</p>
      <p style="margin:6px 0 0">${Rz.yours?'Your house holds the throne. Royal revenues pay 8 gold each season, and every office is yours to fill.':Rz.heir?`Heir: ${heirWord(Rz.heir)} ${esc(Rz.heir.given)}, age ${Rz.heir.age}`:'<span class="hot">No heir. The succession is open.</span>'}</p>`
    :`<p class="kname hot">The throne is empty</p><p class="muted" style="margin:0">The claimants fight it out below.</p>`}</div></div>${!Rz.yours&&!rival(Rz.royal.name)?`<div class="royaledit"><label class="fld"><span>Royal house</span><input data-hname="${esc(Rz.royal.name)}" value="House ${esc(Rz.royal.name)}"></label><label class="fld"><span>Royal seat</span><input data-hseat="${esc(Rz.royal.name)}" value="${esc(Rz.royal.seat||'')}" placeholder="The royal seat"></label><button data-hsigil="${esc(Rz.royal.name)}">Redraw royal sigil</button><button data-sgopen="royal" data-sgname="${esc(Rz.royal.name)}">Edit royal sigil</button></div>${houseMsg&&houseMsg.key===Rz.royal.name?`<p class="hmsg" role="alert">${esc(houseMsg.text)}</p>`:''}`:''}</div></details></section>`;
  const fav=Rz.favor,offs=Object.entries(OFFICES).map(([key,[n,d]])=>{const held=Rz.office===key;const ok=Rz.yours||H.influence>=6&&fav>=5&&k;
    return `<li><span style="min-width:0;flex:1"><b>${n}</b><br><span class="muted">${d}</span></span>${held?'<span class="status ok">Held</span>':`<button class="sm" data-office="${key}" ${ok?'':'disabled'}>${Rz.yours?'Appoint':'Seek it · 6 influence'}</button>`}</li>`}).join('');
  const court=`<section class="pane fold "><details data-fold="court" ${foldOpen('court')?'open':''}><summary><h2>Your standing at court</h2></summary><div class="foldbody">
    <div class="favor"><span class="eyebrow" style="color:var(--gold)">Royal favor</span><span class="fbar" aria-label="Royal favor ${fav} of 10">${Array.from({length:10},(_,i)=>`<i class="${i<fav?'on':''}"></i>`).join('')}</span><b>${fav}</b></div>
    <p class="muted" style="font-size:15px;margin:6px 0 10px">At 7 or more the crown spares you its taxes and grants you lands. Below 3 you lose any office. Seeking an office needs favor 5.</p>
    <div class="acts" style="margin-bottom:10px"><button data-petition="1" ${H.influence>=3&&fav<10&&!Rz.yours&&k?'':'disabled'}>Petition the crown · 3 influence for +1 favor</button></div>
    <h3>Royal offices</h3><ul class="offices">${offs}</ul></div></details></section>`;
  let crisis='';
  if(Rz.crisis){const C=Rz.crisis,tot=C.claimants.reduce((a,c)=>a+c.str,0),done=C.backed||C.own;
    crisis=`<section class="pane fold crisis"><details data-fold="crisis" ${foldOpen('crisis')?'open':''}><summary><h2>Succession crisis</h2></summary><div class="foldbody"><p class="muted" style="margin:0 0 10px">Decided at the end of this season. Each claimant’s chance follows their strength. Back one for 3 influence (+3 strength), or press your own claim with influence 10 or royal favor 7.</p>
      <ul class="claim">${C.claimants.map(c=>`<li><span style="flex:1;min-width:0"><b>${esc(c.label)}</b>${C.backed===c.key?' <span class="status ok">You back them</span>':''}<br><span class="muted">Strength ${c.str} · about ${Math.round(c.str/tot*100)}%</span></span>${!done&&c.key!=='you'?`<button class="sm" data-back="${esc(c.key)}" ${H.influence>=3?'':'disabled'}>Back them</button>`:''}</li>`).join('')}</ul>
      ${!done?`<div class="acts" style="margin-top:10px"><button class="main" data-claim="1" ${canClaim()?'':'disabled'}>Press your own claim</button><span class="muted" style="font-size:14px">Every great house grows more hostile. Lose, and the new crown will hate you.</span></div>`:''}</div></details></section>`}
  const houses=H.rivals.map(houseCard).join('');
  return `${news}${crisis}<div class="two">${crown}${court}</div>
    <section class="pane fold"><details data-fold="web" ${foldOpen('web')?'open':''}><summary><h2>The web of houses</h2></summary><div class="foldbody">${webView()}</div></details></section>

/* ---------- bloodlines ---------- */
const BIRTH_ODDS=[.5,.4,.3,.2,.1,.05];
const childrenOf=(a,b)=>H.members.filter(c=>c.origin==='born'&&!c.dead&&c.parents.includes(a.id)&&c.parents.includes(b.id)).length;
function ensureBlood(){if(!Array.isArray(H.informants))H.informants=[];living().forEach(m=>{if(m.hostage&&isAdult(m)&&!m.kept&&m.returnDue==null)m.returnDue=true});if(!Array.isArray(H.hostageClaims))H.hostageClaims=[];if(H.regency===undefined)H.regency=null;if(H.fallen===undefined)H.fallen=false}

const heirOf=()=>lineOfSuccession()[0]||null;
/* ---------- training: pay 2x the stat per +1; one +1 lands per member each season, in purchase order ---------- */
const trainQ=m=>m.train||(m.train=[]);

const nextTrainCost=(m,k)=>2*(m.st[k]+queuedIn(m,k));
function buyTraining(m,k){
  if(!m||m.dead)return;const cost=nextTrainCost(m,k);
  if(m.st[k]+queuedIn(m,k)>=10||H.gold<cost)return;
  H.gold-=cost;trainQ(m).push({k,cost});
  H.log.push({cycle:H.cycle,text:`Paid ${cost} gold to train ${m.given}'s ${k}.`});

function cancelTraining(m,k){
  const q=trainQ(m),gone=q.filter(t=>t.k===k);if(!gone.length)return;
  const back=gone.reduce((a,t)=>a+t.cost,0);m.train=q.filter(t=>t.k!==k);H.gold+=back;
  H.log.push({cycle:H.cycle,text:`Cancelled ${m.given}'s ${k} training. ${back} gold refunded.`});
}
function settleTraining(){ /* the dead are refunded in full */
  H.members.forEach(m=>{if(m.dead&&m.train&&m.train.length){const back=m.train.reduce((a,t)=>a+t.cost,0);m.train=[];H.gold+=back;
    H.log.push({cycle:H.cycle,text:`${m.given}'s unfinished training is refunded: ${back} gold.`})}});

function trainingTurn(){
  settleTraining();

    const steps=hasBoon(m,'tutor')?2:1;
    for(let s=0;s<steps&&m.train.length;s++){const t=m.train.shift();
    if(m.st[t.k]<10){m.st[t.k]++;m.trainedPts=(m.trainedPts||0)+1;H.log.push({cycle:H.cycle,text:`Training pays off${s?' (master-at-arms)':''}: ${m.given}'s ${t.k} rises to ${m.st[t.k]}.`})}

}
function growChild(m){
  const want=(isAdult(m)?20:childTotal(m.age,m.sp))+(m.trainedPts||0);let have=STATS.reduce((a,k)=>a+m.st[k],0),guard=0;

  while(have<want&&guard++<60){const k=Math.random()<.4?lean:pick(STATS);if(m.st[k]<10){m.st[k]++;have++}}
  if(isAdult(m))enforcePrimary(m.st,m.sp);

function makeChild(a,b){

  const c={id:H.nextId++,given,sex,sp,age:0,title:'',origin:'born',from:'',parents:[a.id,b.id],spouse:null,ruler:false,st,wounds:0,dead:false,
    gear:{weapon:'None',armor:'None',heirloom:'',specialty:''},traits:traitsFor(sp),look:(Math.floor(Math.random()*4294967295)>>>0)||1,born:H.cycle+1};

/* a concubine's child: one parent of the house, marked a bastard; raised as a child of the house but outside the line of succession */

  const c={id:H.nextId++,given,sex,sp,age:0,title:'',origin:'born',bastard:true,from:'',parents:[p.id],spouse:null,ruler:false,st,wounds:0,dead:false,
    gear:{weapon:'None',armor:'None',heirloom:'',specialty:''},traits:traitsFor(sp),look:(Math.floor(Math.random()*4294967295)>>>0)||1,born:H.cycle+1};

/* each new year: everyone ages, children grow, elders weaken, couples may have children */
function bloodlineTurn(say){
  living().forEach(m=>{
    m.age++;
    if(m.age<=adultAge(m))growChild(m);
    if(m.age===adultAge(m)){m.kit=pick(KIT_BY[topStat(m.st)]);if(m.gear.weapon==='None'||m.gear.weapon==='Dagger')m.gear.weapon=topStat(m.st)==='Might'?'Arming sword':'Dagger';
      if(m.hostage){m.returnDue=true;say(`${m.given}, your hostage ward from House ${m.hostage}, comes of age. Decide in Bloodlines whether to send them home.`,'warn')}
      else say(`${m.given} comes of age and can now be sent on operations.`,'good')}
    if(m.age>=spOf(m).old+2&&m.st.Might>1&&Math.random()<.35)m.st.Might--;
    if(m.age>=spOf(m).old&&!m.captive&&!(hasBoon(m,'longlife')&&m.age<spOf(m).old+10)&&Math.random()<(m.age-spOf(m).old+2)*.015){
      if(hasBoon(m,'martyr')){m.gear.heirloom='';say(`${fullName(m)} sickens near to death at ${m.age}, but the Martyr’s token crumbles and they recover.`,'warn')}
      else{m.dead=true;m.fell=`Died of old age in year ${yearOf(H.cycle+1)}`;say(`${fullName(m)} dies of old age, at ${m.age}.`,'bad')}}
  });
  const seen=new Set();
  living().forEach(a=>{const b=spouseOf(a);if(!b||b.dead||seen.has(a.id))return;seen.add(a.id);seen.add(b.id);
    const mother=a.sex==='f'?a:b.sex==='f'?b:null;const FS=spOf(mother).fert;if(!mother||mother.age<FS[0]||mother.age>FS[1]||a.captive||b.captive)return;
    if(Math.random()<birthOdds(mother,childrenOf(a,b))){const father=mother===a?b:a,c=makeChild(mother,father);
      say(`${mother.given} and ${father.given} welcome a ${c.sex==='m'?'son':'daughter'}, ${c.given}.`,'good')}});

/* when the ruler falls: the heir inherits, under a regent if still a child */
function checkSuccession(){
  if(H.fallen)return;
  const r=H.members.find(m=>m.ruler);
  if(H.regency){const h=mem(H.regency.heir);if(!h||h.dead||isAdult(h)){if(h&&!h.dead)H.log.push({cycle:H.cycle,text:`${h.given} comes of age and takes up rule. The regency ends.`});H.regency=null}
    else{const rg=mem(H.regency.regent);if(!rg||rg.dead){const nr=living().filter(m=>isAdult(m)&&!m.captive).sort((a,b)=>b.age-a.age)[0];if(nr){H.regency.regent=nr.id;H.log.push({cycle:H.cycle,text:`${nr.given} becomes regent.`})}}}}
  if(r&&!r.dead)return;
  const heir=lineOfSuccession()[0]||living().filter(m=>m.origin==='adopted').sort((a,b)=>b.age-a.age)[0]||living().sort((a,b)=>b.age-a.age)[0];
  if(r)r.ruler=false;
  if(!heir){H.fallen=true;H.log.push({cycle:H.cycle,text:`The last of House ${H.house.name} is gone. The house has fallen.`});return}
  const old=r?r.given:'the old ruler';
  heir.ruler=true;heir.title=(heir.sex==='m'?'Lord of ':'Lady of ')+H.house.seat;
  let t=`With ${old} dead, ${heir.given} inherits the rule of House ${H.house.name}.`;
  if(!isAdult(heir)){
    const widow=r&&spouseOf(r),reg=widow&&!widow.dead&&isAdult(widow)?widow:living().filter(m=>m!==heir&&isAdult(m)&&!m.captive).sort((a,b)=>b.age-a.age)[0];
    H.regency={heir:heir.id,regent:reg?reg.id:null};
    t+=` ${heir.sex==='m'?'He':'She'} is only ${heir.age}, so ${reg?reg.given+' rules as regent':'no one stands as regent'}. Rival houses smell weakness.`;
    H.rivals.forEach(x=>bump(x,1));if(H.realm)H.realm.favor=Math.max(0,H.realm.favor-1);
  }
  if(H.realm&&H.realm.yours){H.realm.king={given:heir.given,sex:heir.sex,age:heir.age,health:3,member:heir.id};t+=` ${heir.sex==='m'?'He':'She'} takes the throne as well.`}
  H.log.push({cycle:H.cycle,text:t});H.news=(H.news||[]).concat([{t,tone:'bad'}]);

function dowryFor(r){
  const p=r?r.power:1;
  if(p>=3)return {kind:'land',text:'A holdfast as dowry'};
  if(p===2)return {kind:'pact',text:'A trade pact worth 2 gold each season'};
  return {kind:'gold',text:'A dowry of 8 gold'};
}
const marriageable=()=>living().filter(m=>isAdult(m)&&!m.captive&&!isMarried(m)&&m.origin!=='married');

  const age=toSpAge(clamp(Math.round(kinAge(m.age,m.sp))+ri(-6,4),16,70),ssp),st={};STATS.forEach(k=>st[k]=2);let left=12;while(left>0){const k=pick(STATS);if(st[k]<10){st[k]++;left--}}enforcePrimary(st,ssp);
  const sp={id:H.nextId++,given,sex,sp:ssp,age,title:sex==='f'?'Lady '+H.house.name:'Lord consort',origin:'married',from:o.house,parents:[],spouse:m.id,ruler:false,st,wounds:0,dead:false,
    gear:{weapon:'Dagger',armor:'None',heirloom:'',specialty:'Kin in House '+o.house},traits:traitsFor(ssp),look:(Math.floor(Math.random()*4294967295)>>>0)||1};

function declineMatch(i){const o=H.offers[i];if(!o)return;bump(rival(o.house),1);H.offers.splice(i,1);H.log.push({cycle:H.cycle,text:`House ${H.house.name} refuses a match with House ${o.house}, who take it as an insult.`});render()}
function demandWard(i){

function adoptWard(id){

const ITEM_SLOTS={weapon:'Weapon',armor:'Armor',heirloom:'Heirloom',specialty:'Specialty'};

function itemDesc(slot,n){

const fxH=m=>HEIRLOOMS[m.gear.heirloom]||{},fxS=m=>SPECIALTIES[m.gear.specialty]||{};
/* boons: personal effects of boon items, only while the member holds them */
const hasBoon=(m,b)=>!!m&&!m.dead&&(fxH(m).boon===b||fxS(m).boon===b);
function boonTurn(say){
  living().forEach(m=>{
    if(m.captive&&hasBoon(m,'ransom')&&Math.random()<.5){const hn=m.captive.house;m.captive=null;say(`${m.given}'s ransom agent bribes the gaolers of House ${hn}. ${m.given} escapes and comes home.`,'good')}

  });

/* bonus from heirloom and specialty to a roll of `stat`, during an operation of `type` (or none) */
function gearBonus(m,stat,type){
  const h=fxH(m),s=fxS(m);let b=0;

}
function sellPrice(slot,n){const p=slot==='weapon'||slot==='armor'?PRICES[slot][n]:(itemInfo(slot,n)||{}).price;return p?Math.floor(p/2):0}
/* three pieces each season, each rolled +1 to +3, then a ware of that value (no repeats where possible) */
function smithStock(slot){
  const val=slot==='weapon'?wVal:aVal,pool=Object.keys(PRICES[slot]).filter(n=>val(n)>=1&&val(n)<=3),out=[];
  for(let i=0;i<3;i++){const v=1+Math.floor(Math.random()*3);let c=pool.filter(n=>val(n)===v&&!out.includes(n));if(!c.length)c=pool.filter(n=>!out.includes(n));if(c.length)out.push(pick(c))}
  return out.sort((a,b)=>val(a)-val(b));
}
function ensureMarket(){

    H.market={cycle:H.cycle,weapon:smithStock('weapon'),armor:smithStock('armor'),heirloom:shuffle(Object.keys(HEIRLOOMS)).slice(0,3),specialty:shuffle(Object.keys(SPECIALTIES)).slice(0,4)};

  names.forEach(n=>{const c=H.armory.filter(x=>x.slot===slot&&x.name===n).length;h+=opt(n,n+(slot==='weapon'?' (+'+wVal(n)+')':slot==='armor'?' (+'+aVal(n)+')':'')+' · from the armory'+(c>1?' ×'+c:''))});

/* how much an item helps this member: weapons and armor by value; heirlooms and specialties by their best stat and the operations that stat leads */
const ROLE_OPS={Might:['Battle','Conquest'],Grit:['Battle','Conquest'],Ability:['Espionage','Conquest'],Insight:['Intrigue']};
function itemScore(m,slot,n){
  if(!n||n==='None')return 0;

  const best=topStat(m.st),ops=ROLE_OPS[best];let sc=0;

  if((i.wounds||i.fallGrit)&&(best==='Might'||best==='Grit'))sc+=2;
  if(i.taster)sc+=1;
  if(i.boon)sc+=1;

const improves=(m,slot,n)=>itemScore(m,slot,n)>itemScore(m,slot,m.gear[slot])||(!!(itemInfo(slot,n)||{}).boon&&m.gear[slot]!==n);
/* ---------- exchange: gold <-> influence, 6 influence moved per season (shared); the Lord Treasurer gets 4/4 ---------- */
const EX_CAP=6;
const isTreasurer=()=>!!(H.realm&&(H.realm.office==='treasurer'||H.realm.yours));
const exBuy=()=>isTreasurer()?4:5, exSell=()=>isTreasurer()?4:3;
const exUsed=()=>H.exchange&&H.exchange.season===H.cycle?H.exchange.n:0;
const exLeft=()=>Math.max(0,EX_CAP-exUsed());
function exchange(dir,n){
  n=Math.min(n,exLeft());if(n<=0)return;
  if(dir==='buy'){const c=n*exBuy();if(H.gold<c)return;H.gold-=c;H.influence+=n;H.log.push({cycle:H.cycle,text:`Paid ${c} gold for ${n} influence at court.`})}
  else{if(H.influence<n)return;const g=n*exSell();H.influence-=n;H.gold+=g;H.log.push({cycle:H.cycle,text:`Traded ${n} influence for ${g} gold.`})}
  H.exchange={season:H.cycle,n:exUsed()+n};
}

/* ---------- relations with each house ---------- */
const TENSION=['Cordial','Cool','Wary','Hostile','Bitter','Blood feud'];
const STRIKE_HOW={land:'seize your land or send assassins',revenge:'send assassins',crown:'slander you at court',wealth:'raid your storehouses'};
function guards(n){
  const g=[];
  H.pacts.filter(p=>p.house===n&&p.kind.startsWith('Pact of peace')).forEach(p=>g.push(p.kind.includes('coerced')?'a coerced pact of peace':'a pact of peace'));
  if(H.pacts.some(p=>p.house===n&&p.kind==='Marriage alliance'))g.push('a marriage alliance');
  H.members.filter(m=>m.hostage===n&&!m.dead).forEach(m=>g.push(`you hold ${m.given} as a ward`));

}
function tiesWith(n){
  const t=[];const add=(group,text,tone)=>t.push({group,text,tone:tone||''});
  H.pacts.filter(p=>p.house===n).forEach(p=>add('Treaties',p.kind+(p.income?` · +${p.income} gold each season`:''),'good'));
  H.members.filter(m=>m.origin==='married'&&m.from===n).forEach(m=>{const s=spouseOf(m);add('Marriages',`${m.given} of House ${n} is wed to ${s?s.given:'one of yours'}${m.dead?' (dead)':''}`,m.dead?'':'good')});
  H.offers.filter(o=>o.house===n).forEach(()=>add('Marriages','They have offered a marriage. Arrange it in Bloodlines.','warn'));
  H.members.filter(m=>m.hostage===n&&!m.dead).forEach(m=>add('Wards',`You hold ${m.given}, age ${m.age}, as hostage${m.returnDue?'. Decision due':''}`,'good'));
  H.members.filter(m=>m.kept&&m.from===n&&!m.dead).forEach(m=>add('Wards',`${m.given}, once their ward, chose to stay with you`,'bad'));
  H.members.filter(m=>m.returned===n).forEach(m=>add('Wards',`${m.given} was sent home to them`));
  H.members.filter(m=>m.origin==='adopted'&&!m.hostage&&!m.kept&&!m.returned&&m.from===n&&!m.dead).forEach(m=>add('Wards',`${m.given} was born to them and raised by you`));
  H.hostageClaims.filter(c=>c.house===n).forEach(()=>add('Wards','They owe you a ward. Claim it in Bloodlines.','warn'));
  H.informants.filter(i=>i.house===n).forEach(i=>add('Spies',`${i.name} reports to you from inside their hall`,'good'));
  const sec=H.secrets.filter(s=>s.house===n).length;if(sec)add('Spies',`You hold ${sec} of their secret${sec>1?'s':''}`,'good');
  if(H.plans.some(p=>p.house===n))add('Spies','You hold their battle plans','good');
  H.captives.filter(c=>c.house===n).forEach(c=>add('Captives',`You hold ${c.name}, ${c.rank}`,'good'));
  H.members.filter(m=>m.captive&&m.captive.house===n&&!m.dead).forEach(m=>add('Captives',`They hold ${m.given} of your house`,'bad'));

}
function stanceOf(r){

/* rerolling a rival: only a house with no ties to yours, so nothing in your chronicle points at it */

}
function houseCard(r){
  const Rz=H.realm;
  const rels=H.rivals.filter(o=>o!==r&&relation(r.name,o.name)).map(o=>`<span class="${relation(r.name,o.name)==='war'?'hot':'okc'}">${relation(r.name,o.name)==='war'?'at war with':'allied with'} ${esc(o.name)}</span>`).join(' · ');
  const secrets=H.secrets.map((s,i)=>[s,i]).filter(([s])=>s.house===r.name);
  const lev=leverage===r.name;
  const wardBtn=i=>H.members.some(m=>m.hostage===r.name&&!m.dead)||H.hostageClaims.some(c=>c.house===r.name)?'':`<button class="sm" data-bm="${i}|ward">… for a ward</button>`;
  const secretHtml=secrets.length?`<div class="secrets">${lev?secrets.map(([s,i])=>`<div class="sec"><p style="margin:0">${esc(s.text)}.</p><div class="acts"><button class="sm" data-bm="${i}|gold">Blackmail for gold</button><button class="sm" data-bm="${i}|peace">… for peace</button><button class="sm" data-bm="${i}|marriage">… for a marriage</button>${wardBtn(i)}<button class="sm danger" data-expose="${i}">Expose at court</button></div></div>`).join('')+`<button class="sm" data-lev="">Close</button>`:`<button class="sm" data-lev="${esc(r.name)}">Use a secret (${secrets.length})</button>`}</div>`:'';
  const ties=tiesWith(r.name),groups=[...new Set(ties.map(x=>x.group))];
  const tieHtml=groups.length?groups.map(gr=>`<dt>${gr}</dt><dd><ul class="ties">${ties.filter(x=>x.group===gr).map(x=>`<li class="${x.tone}">${esc(x.text)}</li>`).join('')}</ul></dd>`).join(''):'';
  const hist=H.log.filter(l=>l.text.includes('House '+r.name)).slice(-3).reverse();
  return `<article class="hcard" id="house-${esc(r.name)}"><div class="hhead"><svg class="rsig" viewBox="0 0 100 118" aria-hidden="true">${sigilSVG(r.sigil,'h'+r.name)}</svg><div style="min-width:0;flex:1"><h3 style="display:flex;gap:8px;align-items:center"><input class="hedit nm" data-hname="${esc(r.name)}" value="House ${esc(r.name)}" aria-label="Name of House ${esc(r.name)}">${Rz.royal.name===r.name?'<span class="status young">Royal</span>':''}</h3>${houseMsg&&houseMsg.key===r.name?`<p class="hmsg" role="alert">${esc(houseMsg.text)}</p>`:''}<p class="muted" style="margin:0;font-size:15px">${r.lord.sex==='f'?'Lady':'Lord'} ${esc(r.lord.given)}, ${r.sp} · ${r.lord.age}</p><input class="hedit st" data-hseat="${esc(r.name)}" value="Seat: ${esc(r.seat)}" aria-label="Seat of House ${esc(r.name)}"><span class="acts" style="margin-top:4px"><button class="sm" data-hsigil="${esc(r.name)}">Redraw sigil</button><button class="sm" data-sgopen="rival" data-sgname="${esc(r.name)}">Edit sigil</button>${(()=>{const why=rerollBlock(r);return `<button class="sm" data-rerollhouse="${esc(r.name)}" ${why?`disabled title="${esc(why)}"`:'title="Replace this house with a new one"'}>Reroll house</button>`})()}</span></div></div>
    <div class="stance"><span class="eyebrow" style="color:var(--gold)">${stanceOf(r)}</span>${tensionMeter(r)}</div>
    <p class="threat">${threatLine(r)}</p>
    <dl class="opdl">${tieHtml||'<dt>Ties</dt><dd class="muted">None yet. Intrigue, marriage, wards and spies all bind houses together.</dd>'}</dl>
    <dl class="opdl theirs"><dt>Agenda</dt><dd>${AGENDAS[r.agenda]}</dd><dt>Power</dt><dd>${'◆'.repeat(r.power)}${'◇'.repeat(3-r.power)} · ${r.lands} land${r.lands===1?'':'s'}</dd>${rels?`<dt>Realm</dt><dd>${rels}</dd>`:''}</dl>
    ${hist.length?`<details class="hist"><summary>Recent dealings</summary><ul>${hist.map(l=>`<li><span class="cy">${seasonOf(l.cycle)}, yr ${yearOf(l.cycle)}</span>${esc(l.text)}</li>`).join('')}</ul></details>`:''}
    <div class="acts"><button class="sm" data-calm="${esc(r.name)}" ${H.influence>=2&&r.hostility?'':'disabled'}>Ease tensions · 2 influence</button></div>${secretHtml}</article>`;
}

/* ---------- events ---------- */
function doRoll(stat,skill){
  const m=mem(sel);const base=m.st[stat],bonus=(stat==='Might'?wVal(m.gear.weapon):0)+gearBonus(m,stat),target=base+bonus,roll=1+Math.floor(Math.random()*10);
  lastRoll={id:m.id,stat,skill,base,bonus,target,roll,ok:roll===1||(roll!==10&&roll<=target)};render();
}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&sigilEdit){sigilEdit=null;render()}});
document.addEventListener('click',e=>{
  const t=e.target.closest('button,[data-sel],[data-jump],.sgback');if(!t)return;
  if(t.dataset.sec){section=t.dataset.sec;render();return}
  if(t.dataset.sel!=null){sel=+t.dataset.sel;if(t.dataset.go)section=t.dataset.go;lastRoll=null;render();if(t.dataset.go)window.scrollTo({top:0});return}
  if(t.dataset.sgopen){sigilEdit={kind:t.dataset.sgopen,name:t.dataset.sgname||null};render();return}
  if(t.dataset.sgpart){setSigilPart(t.dataset.sgpart,t.dataset.sgval);render();return}
  if(t.dataset.sgclose){if(t.classList.contains('sgback')&&e.target!==t)return;sigilEdit=null;render();return}
  if(t.dataset.rerollhouse){rerollHouse(t.dataset.rerollhouse);render();return}
  if(t.dataset.hsigil!=null){const n=t.dataset.hsigil,r=rival(n);if(r)r.sigil=newSigil();if(H.realm.royal.name===n&&!H.realm.yours)H.realm.royal.sigil=r?r.sigil:newSigil();render();return}
  if(t.dataset.rout!=null){planRout(H.lands[+t.dataset.rout]);render();return}
  if(t.dataset.calloff!=null){callOffRout(H.lands[+t.dataset.calloff]);render();return}
  if(t.dataset.exch){const [d,n]=t.dataset.exch.split('|');exchange(d,+n);render();return}
  if(t.dataset.extraop){extraOperation();render();return}
  if(t.dataset.reroll){if(H.ops.board.length){H.ops.board=genBoard();planning=null;planTeam=[]}render();return}
  if(t.dataset.invest!=null){invest(H.lands[+t.dataset.invest]);render();return}
  if(t.dataset.train){buyTraining(mem(sel),t.dataset.train);render();return}
  if(t.dataset.untrain){cancelTraining(mem(sel),t.dataset.untrain);render();return}
  if(t.dataset.roll){const [s,k]=t.dataset.roll.split('|');doRoll(s,k);return}
  if(t.dataset.wound){const m=mem(sel);m.wounds=clamp(m.wounds+(+t.dataset.wound),0,maxWounds(m));render();return}
  if(t.dataset.plan!=null){planning=t.dataset.plan===''?null:+t.dataset.plan;planTeam=[];render();return}
  if(t.dataset.pick!=null){const id=+t.dataset.pick;planTeam=planTeam.includes(id)?planTeam.filter(x=>x!==id):planTeam.concat(id);render();return}
  if(t.dataset.launch){launch(+t.dataset.launch);return}
  if(t.dataset.stageroll){const [a,b]=t.dataset.stageroll.split('|');rollStage(+a,+b);return}
  if(t.dataset.closeop){closeOp(+t.dataset.closeop);return}
  if(t.dataset.ransom!=null){const c=H.captives.splice(+t.dataset.ransom,1)[0];if(c){H.gold+=c.ransom;H.log.push({cycle:H.cycle,text:`House ${c.house} paid ${c.ransom} gold to free ${c.name}.`})}render();return}
  if(t.dataset.payransom){const m=mem(+t.dataset.payransom);if(m&&m.captive&&H.gold>=m.captive.ransom){H.gold-=m.captive.ransom;H.log.push({cycle:H.cycle,text:`Paid ${m.captive.ransom} gold to House ${m.captive.house} for ${m.given}'s freedom.`});m.captive=null}render();return}
  if(t.id==='endCycle'){endCycle();window.scrollTo({top:0});return}
  if(t.dataset.bm){const [i,d]=t.dataset.bm.split('|');blackmail(+i,d);return}
  if(t.dataset.expose!=null){expose(+t.dataset.expose);return}
  if(t.dataset.lev!=null){leverage=t.dataset.lev||null;render();return}
  if(t.dataset.calm){calm(t.dataset.calm);return}
  if(t.dataset.petition){petition();return}
  if(t.dataset.office){seekOffice(t.dataset.office);return}
  if(t.dataset.back){backClaim(t.dataset.back);return}
  if(t.dataset.claim){pressClaim();return}
  if(t.dataset.arrange){const i=+t.dataset.arrange,sl=$('match-'+i);if(sl)arrangeMatch(i,+sl.value);return}
  if(t.dataset.decline){declineMatch(+t.dataset.decline);return}
  if(t.dataset.ward){demandWard(+t.dataset.ward);return}
  if(t.dataset.jump){const el=document.getElementById(t.dataset.jump);const d=document.querySelector('details[data-fold="houses"]');if(d&&!d.open)d.open=true;if(el)el.scrollIntoView({behavior:'smooth',block:'start'});return}
  if(t.dataset.adopt){adoptWard(+t.dataset.adopt);return}
  if(t.dataset.relook){const m=mem(+t.dataset.relook);if(m)m.look=(Math.floor(Math.random()*4294967295)>>>0)||1;render();return}
  if(t.dataset.buy){const k=t.dataset.buy.indexOf('|');buy(t.dataset.buy.slice(0,k),t.dataset.buy.slice(k+1));return}
  if(t.dataset.sell!=null){sell(+t.dataset.sell);return}
  if(t.dataset.give!=null){const i=+t.dataset.give,it=H.armory[i],sl=$('give-'+i),m=sl&&mem(+sl.value);if(it&&m){equip(m,it.slot,it.name);H.log.push({cycle:H.cycle,text:`${m.given} takes up the ${it.name}.`})}render();return}
  if(t.dataset.return){const [i,k]=t.dataset.return.split('|');returnWard(+i,k);return}
  if(t.id==='newSigil'){R=Math.random;H.house.sigil=newSigil();render();return}
  if(t.id==='savesBtn'){savesOpen=!savesOpen;pendingDelete=null;t.setAttribute('aria-expanded',savesOpen);renderSaves();return}
  if(t.dataset.closesaves){savesOpen=false;$('savesBtn').setAttribute('aria-expanded','false');renderSaves();return}
  if(t.dataset.loadslot){switchSlot(t.dataset.loadslot);renderSaves();return}
  if(t.dataset.newslot){newGameSlot();renderSaves();return}
  if(t.dataset.delslot){pendingDelete=t.dataset.delslot;renderSaves();return}
  if(t.dataset.delslotYes){deleteSlot(t.dataset.delslotYes);return}
  if(t.dataset.delslotNo){pendingDelete=null;renderSaves();return}
  if(t.id==='newHouse'){pendingConfirm=true;$('confirmBox').innerHTML=`<div class="confirm"><span>Found a new House in this save slot? The current House and everyone in it will be lost. To keep it, use Saves → Start a new House in a new slot.</span><button class="danger" id="yesNew">Found a new House</button><button id="noNew">Keep this House</button></div>`;return}
  if(t.id==='yesNew'){H=generate((Math.random()*4294967295)>>>0);ensureState();planning=null;planTeam=[];sel=H.members.find(m=>m.ruler).id;lastRoll=null;$('confirmBox').innerHTML='';render();{const meta=readMeta(),sl=meta.slots.find(x=>x.id===activeSlot);if(sl&&/^House /.test(sl.name)){sl.name='House '+H.house.name;writeMeta(meta)}}save();renderSaves();return}
  if(t.id==='noNew'){$('confirmBox').innerHTML='';return}
});
document.addEventListener('toggle',e=>{if(e.target.matches&&e.target.matches('details.ravens'))ravensOpen=e.target.open},true);
document.addEventListener('toggle',e=>{const d=e.target;if(d&&d.dataset&&d.dataset.fold&&H){H.ui=H.ui||{};H.ui.folds=H.ui.folds||{};H.ui.folds[d.dataset.fold]=d.open;save()}},true);
document.addEventListener('keydown',e=>{if(e.target&&e.target.id==='hname'&&e.key==='Enter'){e.preventDefault();e.target.blur()}});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('g.node,g.hnode')){e.preventDefault();e.target.dispatchEvent(new MouseEvent('click',{bubbles:true}))}});
window.addEventListener('resize',()=>{try{fitNames()}catch(e){}});
document.addEventListener('input',e=>{
  if(e.target&&e.target.id==='hname')fitArea(e.target,22);else if(e.target&&e.target.matches&&e.target.matches('input.hedit.nm'))fitInput(e.target,12);
  const t=e.target,m=H&&mem(sel);
  if(t.dataset.edit&&m){m[t.dataset.edit]=t.value;const b=document.querySelector(`ul.roster button[data-sel="${m.id}"]`);if(b){b.querySelector('.rn').textContent=m.given;}save();return}
  if(t.dataset.gear&&m&&t.tagName==='TEXTAREA'){m.gear[t.dataset.gear]=t.value;save();return}
});
document.addEventListener('change',e=>{
  const t=e.target,m=H&&mem(sel);
  if(t.dataset.hname!=null){tryRenameHouse(t.dataset.hname,t.value,t.dataset.hname);render();return}
  if(t.dataset.hseat!=null){const n=t.dataset.hseat,r=rival(n)||(H.realm.royal.name===n?H.realm.royal:null);if(r){const v=t.value.replace(/^seat:\s*/i,'').trim().slice(0,40);if(v)r.seat=v}render();return}
  if(t.dataset.gear&&m&&t.tagName==='SELECT'){equip(m,t.dataset.gear,t.value);render();return}
  if(t.dataset.rename){renameSlot(t.dataset.rename,t.value);return}
  if(t.dataset.match){matchPick[+t.dataset.match]=+t.value;return}
  if(t.dataset.edit){render();return}
  if(t.id==='hname'){H.house.name=t.value.replace(/^\s*house\s+/i,'').trim()||H.house.name;render()}
  if(t.id==='hwords'){H.house.words=t.value.replace(/[“”"]/g,'').trim()||H.house.words;render()}
  if(t.id==='hseat'){const old=H.house.seat,nw=t.value.replace(/^\s*seat:\s*/i,'').trim()||old;H.house.seat=nw;H.members.forEach(m=>{if(m.title.includes(old))m.title=m.title.replace(old,nw)});render()}
});

/* ---------- start ---------- */
function start(d){
  if(d&&d.H){H=d.H;sel=d.sel||0;section=d.section||'house';activeSlot=d.activeSlot||readMeta().active}
  else if(!load()){H=generate((Math.random()*4294967295)>>>0);sel=H.members.find(m=>m.ruler).id}
  ensureState();
  render();
}
try{window.claude?.hot?.snapshot(()=>({H,sel,section,activeSlot}))}catch(e){}
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
</script>
